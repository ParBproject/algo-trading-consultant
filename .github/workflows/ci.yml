name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: python -m pip install --upgrade pip "ruff==0.16.9"

      - name: Check syntax and critical errors
        run: ruff check src data tests --select E9,F63,F7,F82

      - name: Check pyflakes
        run: ruff check --select F src data tests notebooks scripts

      - name: Compile Python sources
        run: python -m compileall -q src data tests

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
