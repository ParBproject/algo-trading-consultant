# Read by `python src/run_bot.py --config`.
# Stops, the drawdown halt, and parameter search are arguments on the
# functions that use them. API keys belong in the environment.

data:
  tickers: ["AAPL", "MSFT", "SPY"]  # the CLI uses the first ticker
  start_date: "2020-01-01"
  end_date: "2024-01-01"
  interval: "1d"                     # 1m, 5m, 1h, 1d, 1wk

strategy:
  name: "mean_reversion"             # mean_reversion or momentum
  params:
    # Fields the selected strategy does not accept are ignored.
    # Mean reversion
    lookback: 20
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70

    # Momentum
    fast_period: 12
    slow_period: 26
    signal_period: 9
    atr_period: 14

risk:
  max_position_pct: 0.10             # fraction of equity for one paper order

backtesting:
  initial_capital: 100000
  commission_pct: 0.001              # one-way, 10 bps
  slippage_pct: 0.0005               # one-way, 5 bps

execution:
  # paper stays in process. alpaca and ccxt read keys from the environment
  # and stay on paper or sandbox endpoints unless the CLI is passed --allow-live.
  broker: "paper"                    # paper | alpaca | ccxt
  paper_trading: true

logging:
  level: "INFO"
