# ─────────────────────────────────────────────
# algo-trading-consultant · example config
# ─────────────────────────────────────────────

data:
  tickers: ["AAPL", "MSFT", "SPY"]
  start_date: "2020-01-01"
  end_date: "2024-01-01"
  interval: "1d"           # 1m, 5m, 1h, 1d
  cache_dir: "data/cache"

strategy:
  name: "mean_reversion"   # mean_reversion | momentum | pairs_trading
  params:
    # Mean Reversion
    lookback: 20
    entry_z: 2.0
    exit_z: 0.5
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70

    # Momentum
    fast_period: 12
    slow_period: 26
    signal_period: 9
    atr_period: 14

    # Pairs Trading
    pair: ["AAPL", "MSFT"]
    half_life_window: 60
    entry_spread_z: 2.0
    exit_spread_z: 0.5

risk:
  max_position_pct: 0.10        # max 10% of portfolio per trade
  stop_loss_pct: 0.02           # 2% stop loss
  take_profit_pct: 0.04         # 4% take profit
  max_drawdown_pct: 0.15        # halt if drawdown > 15%
  sizing_method: "fixed_pct"    # fixed_pct | kelly | volatility_scaled
  kelly_fraction: 0.25          # fractional Kelly

backtesting:
  initial_capital: 100000
  commission_pct: 0.001         # 0.1%
  slippage_pct: 0.0005          # 0.05%
  use_vectorized: true          # false = event-driven (backtrader)

optimization:
  method: "grid"                # grid | random | bayesian
  n_trials: 200
  cv_folds: 5
  holdout_fraction: 0.2         # tail excluded from parameter selection
  metric: "sharpe"              # sharpe | sortino | calmar | total_return
  param_space:
    lookback: [10, 15, 20, 30, 50]
    entry_z: [1.5, 2.0, 2.5, 3.0]
    exit_z: [0.0, 0.25, 0.5, 1.0]
    rsi_period: [10, 14, 21]

execution:
  # paper is the in-memory broker. alpaca and ccxt are opt-in and still
  # default to paper/sandbox endpoints. A live endpoint also needs
  # --allow-live on the command line. Put keys in the environment
  # (see .env.example); this file does not contain them.
  broker: "paper"               # paper | alpaca | ccxt
  paper_trading: true
  alpaca:
    base_url: "https://paper-api.alpaca.markets"
  ccxt:
    exchange: "binance"

logging:
  level: "INFO"
  log_dir: "logs"
  trade_log: "logs/trades.csv"

reporting:
  output_dir: "reports"
  generate_pdf: true
